name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 安装 CMake
        run: sdkmanager "cmake;3.22.1"

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug

      - name: 构建 Release APK
        run: ./gradlew assembleRelease

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GpuBench-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GpuBench-release
          path: app/build/outputs/apk/release/*.apk

      - name: 获取版本号
        id: version
        run: echo "version=v$(date +'%Y%m%d')-$(echo $GITHUB_SHA | head -c 7)" >> $GITHUB_OUTPUT

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "GpuBench ${{ steps.version.outputs.version }}"
          body: |
            ## 🎮 GpuBench ${{ steps.version.outputs.version }}

            自动构建于 $(date +'%Y-%m-%d %H:%M:%S') UTC

            ### 📦 下载 APK
            - **Debug 版本**: `app-debug.apk` - 用于开发调试
            - **Release 版本**: `app-release-unsigned.apk` - 用于正式测试

            ### 🔧 构建信息
            - 提交: `${{ github.sha }}`
            - 分支: `${{ github.ref_name }}`
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
